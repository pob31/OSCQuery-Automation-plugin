# OSCQuery Automation Plugin — Copyright (C) 2026 Pierre-Olivier Boulant, Julien Bayle
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Three-platform CI (devplan, Phase 0 and cross-cutting). Structure from go.dot's ci.yml,
# plugin specifics from WFS-DIY's plugins-ci.yml.
#
#   pins     no compiler: CLAUDE.md against the PRD, submodule pins against
#            THIRD_PARTY_NOTICES.md, GPL headers. The cheapest job; the others wait for it.
#   linux    build, test under C and fr_FR, Release plugin, pluginval, the CLAP and
#            clap-validator (Phase 5b), artefact.
#   macos    the same, VST3 and AU built, VST3 validated (auval is Phase 1's).
#   windows  the same, on the VS 2026 image.
#
# Artefacts are unsigned. Signing and notarisation belong to the release workflow (Phase 7).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4
  PLUGIN_DIR: src/shims/juce/oqa_plugin_32_artefacts/Release
  PLUGIN_NAME: OSCQuery Automation 32
  # The Monitor (Phase 6c): zero parameters, validated like the slot plugin.
  MONITOR_DIR: src/shims/juce/oqa_plugin_monitor_artefacts/Release
  MONITOR_NAME: OSCQuery Automation Monitor
  # clap-validator 0.4.1 (THIRD_PARTY_NOTICES.md); its release assets carry the build string, and
  # the Linux and macOS zips wrap a tarball (named 0.3.2 by the release's own tooling).
  CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1
  CLAP_VALIDATOR_BUILD: clap-validator-0.4.1-127-g152b982

# THE VALIDATORS RUN THE PLUGIN WITH DNS-SD OFF (2026-11-10). pluginval and clap-validator load
# the real plugin, which reads the per-user settings: its server on, announced over multicast
# DNS, in a couple of hundred processes at once for clap-validator. That sent 11,600 multicast
# datagrams in a second from one machine and took a phone's hotspot down
# (docs/bench/2026-11-10-mdns-flood.md). Each validator step copies tests/validators.registry.json
# (the server still on, discovery off) and names the copy in OQA_SETTINGS_FILE.
  CLAP_DIR: src/shims/clap/oqa_clap_artefacts/Release
  CLAP_NAME: OSCQuery Automation.clap

jobs:
  pins:
    name: pins (no compiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # check-pins reads the nested asio pin from juce_simpleweb's own index.
      - name: Initialise juce_simpleweb (not recursively)
        run: git submodule update --init ThirdParty/juce_simpleweb

      - name: CLAUDE.md matches the PRD
        run: python3 scripts/check-claude-md.py

      - name: Submodule pins match THIRD_PARTY_NOTICES.md
        run: python3 scripts/check-pins.py

      - name: GPL headers on every source file
        run: python3 scripts/check-headers.py

      # The ToscA/OSCar converter (Phase 5c) against its fixtures: the committed
      # expected outputs are what it writes today.
      - name: oqa-bind.py loads and answers --help (Phase 6b-3)
        run: python3 tools/oqa-bind.py --help > /dev/null

      - name: convert-mapping.py reproduces its fixtures
        run: |
          python3 tools/convert-mapping.py tests/fixtures/mappings/tosca-example.xml --device Renderer --host 192.0.2.10 --port 5005 --instance 3 | diff - tests/fixtures/mappings/tosca-example.expected.json
          python3 tools/convert-mapping.py tests/fixtures/mappings/oscar-example.xml --device Renderer --host 192.0.2.10 --port 5005 --instance 7 | diff - tests/fixtures/mappings/oscar-example.expected.json

  linux:
    name: build + test + pluginval (Linux)
    needs: pins
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        # go.dot's list for JUCE 9 with the web browser and curl off; xvfb for pluginval.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build ccache locales xvfb unzip \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxrender-dev libgl-dev

      - name: Generate the fr_FR.UTF-8 locale
        run: |
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale

      - name: Submodule SHAs, for the cache key
        id: subs
        run: |
          echo "juce=$(git rev-parse HEAD:ThirdParty/JUCE)" >> "$GITHUB_OUTPUT"
          echo "sw=$(git rev-parse HEAD:ThirdParty/juce_simpleweb)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ steps.subs.outputs.juce }}-${{ steps.subs.outputs.sw }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ steps.subs.outputs.juce }}-${{ steps.subs.outputs.sw }}-
            ccache-linux-

      - name: Configure (ci-linux), no CMake warnings outside ThirdParty
        run: |
          set -euo pipefail
          cmake --preset ci-linux 2>&1 | tee configure.log
          if grep '^CMake Warning' configure.log | grep -v 'ThirdParty/'; then
            echo "::error::configure emitted warnings outside ThirdParty/"
            exit 1
          fi

      - name: Build (Debug)
        run: cmake --build --preset ci-linux-debug

      - name: Test (Debug, C and fr_FR)
        run: ctest --preset ci-linux

      - name: Build the plugin and the CLAP (Release)
        run: cmake --build --preset ci-linux-release --target oqa_plugin_32_All oqa_plugin_monitor_All oqa_clap

      - name: pluginval, strictness 5
        run: |
          cp tests/validators.registry.json "$RUNNER_TEMP/oqa-validators.json"
          export OQA_SETTINGS_FILE="$RUNNER_TEMP/oqa-validators.json"
          curl -sSL -o pluginval.zip "$PLUGINVAL_URL/pluginval_Linux.zip"
          unzip -q pluginval.zip -d pluginval
          chmod +x pluginval/pluginval
          xvfb-run -a ./pluginval/pluginval --strictness-level 5 --validate-in-process \
            --timeout-ms 300000 --validate "build/ci-linux/$PLUGIN_DIR/VST3/$PLUGIN_NAME.vst3"
          xvfb-run -a ./pluginval/pluginval --strictness-level 5 --validate-in-process \
            --timeout-ms 300000 --validate "build/ci-linux/$MONITOR_DIR/VST3/$MONITOR_NAME.vst3"

      - name: clap-validator
        run: |
          cp tests/validators.registry.json "$RUNNER_TEMP/oqa-validators.json"
          export OQA_SETTINGS_FILE="$RUNNER_TEMP/oqa-validators.json"
          curl -sSL -o clap-validator.zip "$CLAP_VALIDATOR_URL/$CLAP_VALIDATOR_BUILD-ubuntu-22.04.zip"
          unzip -q clap-validator.zip -d clap-validator
          for t in clap-validator/*.tar.gz; do [ -f "$t" ] && tar -xzf "$t" -C clap-validator; done
          CV=$(find clap-validator -type f -name 'clap-validator' | head -1)
          chmod +x "$CV"
          "$CV" validate "build/ci-linux/$CLAP_DIR/$CLAP_NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: oqa-plugin-linux-unsigned
          path: |
            build/ci-linux/${{ env.PLUGIN_DIR }}/VST3/
            build/ci-linux/${{ env.MONITOR_DIR }}/VST3/
            build/ci-linux/${{ env.CLAP_DIR }}/
          if-no-files-found: error

  macos:
    name: build + test + pluginval (macOS)
    needs: pins
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install ninja and ccache
        run: brew install ninja ccache

      - name: Submodule SHAs, for the cache key
        id: subs
        run: |
          echo "juce=$(git rev-parse HEAD:ThirdParty/JUCE)" >> "$GITHUB_OUTPUT"
          echo "sw=$(git rev-parse HEAD:ThirdParty/juce_simpleweb)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ steps.subs.outputs.juce }}-${{ steps.subs.outputs.sw }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ steps.subs.outputs.juce }}-${{ steps.subs.outputs.sw }}-
            ccache-macos-

      - name: Configure (ci-macos)
        run: cmake --preset ci-macos

      - name: Build (Debug)
        run: cmake --build --preset ci-macos-debug

      # What each image exports (Phase 5b): the CLAP module and the core library should
      # each show one external symbol; JUCE's singletons must be private in all three.
      - name: Exports of the module, the library and the test host (information)
        run: |
          for f in "build/ci-macos/src/shims/clap/oqa_clap_artefacts/Debug/OSCQuery Automation.clap/Contents/MacOS/OSCQuery Automation"                    build/ci-macos/src/core/core-shared/Debug/libOSCQuery-Automation-Core.dylib                    build/ci-macos/tests/clap/Debug/oqa_clap_tests; do
            echo "== $f"
            echo "external symbols: $(nm -gU "$f" | wc -l | tr -d ' ')"
            nm -m "$f" | grep -E "attributesString|emptyString" | head -4 || true
          done

      - name: Test (Debug, C and fr_FR)
        run: ctest --preset ci-macos

      - name: Build the plugin and the CLAP (Release)
        run: cmake --build --preset ci-macos-release --target oqa_plugin_32_All oqa_plugin_monitor_All oqa_clap

      - name: pluginval, strictness 5 (VST3)
        run: |
          cp tests/validators.registry.json "$RUNNER_TEMP/oqa-validators.json"
          export OQA_SETTINGS_FILE="$RUNNER_TEMP/oqa-validators.json"
          curl -sSL -o pluginval.zip "$PLUGINVAL_URL/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval
          ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            --timeout-ms 300000 --validate "build/ci-macos/$PLUGIN_DIR/VST3/$PLUGIN_NAME.vst3"
          ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            --timeout-ms 300000 --validate "build/ci-macos/$MONITOR_DIR/VST3/$MONITOR_NAME.vst3"

      - name: clap-validator
        run: |
          cp tests/validators.registry.json "$RUNNER_TEMP/oqa-validators.json"
          export OQA_SETTINGS_FILE="$RUNNER_TEMP/oqa-validators.json"
          curl -sSL -o clap-validator.zip "$CLAP_VALIDATOR_URL/$CLAP_VALIDATOR_BUILD-macos-universal.zip"
          unzip -q clap-validator.zip -d clap-validator
          for t in clap-validator/*.tar.gz; do [ -f "$t" ] && tar -xzf "$t" -C clap-validator; done
          CV=$(find clap-validator -type f -name 'clap-validator' | head -1)
          chmod +x "$CV"
          "$CV" validate "build/ci-macos/$CLAP_DIR/$CLAP_NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: oqa-plugin-macos-unsigned
          path: |
            build/ci-macos/${{ env.PLUGIN_DIR }}/VST3/
            build/ci-macos/${{ env.PLUGIN_DIR }}/AU/
            build/ci-macos/${{ env.MONITOR_DIR }}/VST3/
            build/ci-macos/${{ env.MONITOR_DIR }}/AU/
            build/ci-macos/${{ env.CLAP_DIR }}/
          if-no-files-found: error

  windows:
    name: build + test + pluginval (Windows)
    needs: pins
    # windows-2025 is the VS 2026 image, the same deliberate pin as WFS-DIY and go.dot.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (ci-windows)
        run: cmake --preset ci-windows

      - name: Build (Debug)
        run: cmake --build --preset ci-windows-debug --parallel

      - name: Test (Debug, C and fr-FR)
        run: ctest --preset ci-windows

      - name: Build the plugin and the CLAP (Release)
        run: cmake --build --preset ci-windows-release --target oqa_plugin_32_All oqa_plugin_monitor_All oqa_clap --parallel

      - name: pluginval, strictness 5
        shell: bash
        run: |
          cp tests/validators.registry.json "$RUNNER_TEMP/oqa-validators.json"
          export OQA_SETTINGS_FILE="$RUNNER_TEMP/oqa-validators.json"
          curl -sSL -o pluginval.zip "$PLUGINVAL_URL/pluginval_Windows.zip"
          unzip -q pluginval.zip -d pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process \
            --timeout-ms 300000 --validate "build/ci-windows/$PLUGIN_DIR/VST3/$PLUGIN_NAME.vst3"
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process \
            --timeout-ms 300000 --validate "build/ci-windows/$MONITOR_DIR/VST3/$MONITOR_NAME.vst3"

      - name: clap-validator
        shell: bash
        run: |
          cp tests/validators.registry.json "$RUNNER_TEMP/oqa-validators.json"
          export OQA_SETTINGS_FILE="$RUNNER_TEMP/oqa-validators.json"
          curl -sSL -o clap-validator.zip "$CLAP_VALIDATOR_URL/$CLAP_VALIDATOR_BUILD-windows.zip"
          unzip -q clap-validator.zip -d clap-validator
          CV=$(find clap-validator -type f -name 'clap-validator*.exe' | head -1)
          "$CV" validate "build/ci-windows/$CLAP_DIR/$CLAP_NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: oqa-plugin-windows-unsigned
          path: |
            build/ci-windows/${{ env.PLUGIN_DIR }}/VST3/
            build/ci-windows/${{ env.MONITOR_DIR }}/VST3/
            build/ci-windows/${{ env.CLAP_DIR }}/
          if-no-files-found: error
